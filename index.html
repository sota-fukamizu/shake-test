<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>炭酸シェイク</title>

    <style>

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 60px;
            font-size: 40px;
        }

        button {
            width: 80%;
            height: 150px;

            margin-top: 40px;

            font-size: 35px;
        }

        .value {
            font-size: 35px;
            margin-top: 30px;
        }

        #status {
            margin-top: 30px;
            font-size: 22px;
        }

        #gauge {
            width: 80%;
            height: 40px;
            margin: 40px auto 20px;

            background: #333;
        }

        #gaugeFill {
            width: 0%;
            height: 100%;
            background: #00aaff;

            transition: width 0.1s;
        }

        #power {
            font-size: 30px;
        }
    </style>

</head>


<body>

    <h1>🥤 炭酸シェイク</h1>

    <button onclick="startSensor()">
        センサー開始
    </button>


    <div id="status">
        センサー未開始
    </div>


    <div class="value">
        X : <span id="x">0</span>
    </div>

    <div class="value">
        Y : <span id="y">0</span>
    </div>

    <div class="value">
        Z : <span id="z">0</span>
    </div>

    <div id="gauge">
        <div id="gaugeFill"></div>
    </div>

    <div id="power">
        炭酸：0%
    </div>

    <div id="shakeCount">
        シェイク回数：0
    </div>

    <script>

        // =========================
        // センサー用
        // =========================

        let previousX = null;
        let previousY = null;
        let previousZ = null;


        // =========================
        // 炭酸
        // =========================

        let carbonatedPower = 0;


        // =========================
        // シェイク判定
        // =========================

        let shakeCount = 0;

        let lastShakeTime = 0;

        const SHAKE_THRESHOLD = 3.0;

        const SHAKE_COOLDOWN = 500;


        // =========================
        // センサー開始
        // =========================

        async function startSensor() {
            const status =
                document.getElementById("status");


            try {
                // iPhoneなどで必要
                if (
                    typeof DeviceMotionEvent !== "undefined" &&
                    typeof DeviceMotionEvent.requestPermission === "function"
                ) {
                    const permission =
                        await DeviceMotionEvent.requestPermission();


                    if (permission !== "granted") {
                        status.textContent =
                            "センサー許可が拒否されました";

                        return;
                    }
                }


                // センサーイベント登録
                window.addEventListener(
                    "devicemotion",
                    onMotion
                );


                status.textContent =
                    "センサー開始";


                console.log("センサー開始");


            }
            catch (error) {
                status.textContent =
                    "エラー : " + error;

                console.error(error);
            }
        }


        // =========================
        // 加速度取得
        // =========================

        function onMotion(event) {
            const acceleration =
                event.accelerationIncludingGravity;


            if (!acceleration) {
                return;
            }


            // =========================
            // 現在の加速度
            // =========================

            const x = acceleration.x ?? 0;
            const y = acceleration.y ?? 0;
            const z = acceleration.z ?? 0;


            // =========================
            // X/Y/Z表示
            // =========================

            document.getElementById("x")
                .textContent =
                x.toFixed(2);


            document.getElementById("y")
                .textContent =
                y.toFixed(2);


            document.getElementById("z")
                .textContent =
                z.toFixed(2);


            // =========================
            // 初回だけ基準値を保存
            // =========================

            if (
                previousX === null ||
                previousY === null ||
                previousZ === null
            ) {
                previousX = x;
                previousY = y;
                previousZ = z;

                return;
            }


            // =========================
            // 前回との差
            // =========================

            const dx = x - previousX;
            const dy = y - previousY;
            const dz = z - previousZ;


            // =========================
            // シェイクの強さ
            // =========================

            const shakePower =
                Math.sqrt(
                    dx * dx +
                    dy * dy +
                    dz * dz
                );


            // =========================
            // 炭酸を増やす
            // =========================

            if (shakePower >= SHAKE_THRESHOLD) {
                carbonatedPower +=
                    shakePower * 0.5;


                // 100%を超えない
                carbonatedPower =
                    Math.min(
                        carbonatedPower,
                        100
                    );


                // ゲージ
                document.getElementById("gaugeFill")
                    .style.width =
                    carbonatedPower + "%";


                // 数字
                document.getElementById("power")
                    .textContent =
                    "炭酸：" +
                    carbonatedPower.toFixed(1) +
                    "%";
            }


            // =========================
            // シェイク回数
            // =========================

            const now = Date.now();


            if (
                shakePower >= SHAKE_THRESHOLD &&
                now - lastShakeTime >= SHAKE_COOLDOWN
            ) {
                shakeCount++;

                lastShakeTime = now;


                document.getElementById("shakeCount")
                    .textContent =
                    "シェイク回数：" +
                    shakeCount;


                console.log(
                    "SHAKE!",
                    shakeCount,
                    shakePower
                );
            }


            // =========================
            // 現在値を保存
            // =========================

            previousX = x;
            previousY = y;
            previousZ = z;
        }

    </script>

</body>

</html>
