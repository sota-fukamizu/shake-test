<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>炭酸シェイク</title>

    <style>

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 60px;
            font-size: 40px;
        }

        button {
            width: 80%;
            height: 150px;

            margin-top: 40px;

            font-size: 35px;
        }

        .value {
            font-size: 35px;
            margin-top: 30px;
        }

        #status {
            margin-top: 30px;
            font-size: 22px;
        }

        #gauge {
            width: 80%;
            height: 40px;
            margin: 40px auto 20px;

            background: #333;
        }

        #gaugeFill {
            width: 0%;
            height: 100%;
            background: #00aaff;

            transition: width 0.1s;
        }

        #power {
            font-size: 30px;
        }
    </style>

</head>


<body>

    <h1>🥤 炭酸シェイク</h1>

    <button onclick="startSensor()">
        センサー開始
    </button>


    <div id="status">
        センサー未開始
    </div>


    <div class="value">
        X : <span id="x">0</span>
    </div>

    <div class="value">
        Y : <span id="y">0</span>
    </div>

    <div class="value">
        Z : <span id="z">0</span>
    </div>

    <div id="gauge">
    <div id="gaugeFill"></div>
    </div>

    <div id="power">
        炭酸：0%
    </div>

    <script>

        // =========================
        // センサー開始
        // =========================
    let previousX = 0;
    let previousY = 0;
    let previousZ = 0;

    let carbonatedPower = 0;
        async function startSensor()
        {
            const status =
                document.getElementById("status");


            try
            {

                // iPhoneなどで必要になる
                // Androidでは通常ここは通らない

                if (
                    typeof DeviceMotionEvent !== "undefined" &&
                    typeof DeviceMotionEvent.requestPermission === "function"
                )
                {

                    const permission =
                        await DeviceMotionEvent.requestPermission();


                    if (permission !== "granted")
                    {
                        status.textContent =
                            "センサー許可が拒否されました";

                        return;
                    }

                }


                // センサーイベント登録

                window.addEventListener(
                    "devicemotion",
                    onMotion
                );


                status.textContent =
                    "センサー開始";


            }
            catch (error)
            {

                status.textContent =
                    "エラー : " + error;

                console.error(error);

            }

        }


        // =========================
        // 加速度取得
        // =========================

        function onMotion(event)
        {

            function onMotion(event) {
                const acceleration =
                    event.accelerationIncludingGravity;

                if (!acceleration) {
                    return;
                }


                // =========================
                // 現在の加速度
                // =========================

                const x = acceleration.x ?? 0;
                const y = acceleration.y ?? 0;
                const z = acceleration.z ?? 0;


                // X/Y/Z表示
                document.getElementById("x")
                    .textContent =
                    x.toFixed(2);

                document.getElementById("y")
                    .textContent =
                    y.toFixed(2);

                document.getElementById("z")
                    .textContent =
                    z.toFixed(2);


                // =========================
                // 前回との差
                // =========================

                const dx = x - previousX;
                const dy = y - previousY;
                const dz = z - previousZ;


                // 加速度の変化量
                const movement =
                    Math.sqrt(
                        dx * dx +
                        dy * dy +
                        dz * dz
                    );


                // =========================
                // 一番大きく動いた方向を調べる
                // =========================

                let direction = 0;

                if (Math.abs(dx) >= Math.abs(dy) &&
                    Math.abs(dx) >= Math.abs(dz)) {
                    // X方向

                    if (dx > DIRECTION_THRESHOLD) {
                        direction = 1;
                    }
                    else if (dx < -DIRECTION_THRESHOLD) {
                        direction = -1;
                    }
                }
                else if (Math.abs(dy) >= Math.abs(dz)) {
                    // Y方向

                    if (dy > DIRECTION_THRESHOLD) {
                        direction = 1;
                    }
                    else if (dy < -DIRECTION_THRESHOLD) {
                        direction = -1;
                    }
                }
                else {
                    // Z方向

                    if (dz > DIRECTION_THRESHOLD) {
                        direction = 1;
                    }
                    else if (dz < -DIRECTION_THRESHOLD) {
                        direction = -1;
                    }
                }


                // =========================
                // シェイク判定
                // =========================

                const now = Date.now();


                if (
                    movement >= SHAKE_THRESHOLD &&
                    direction !== 0
                ) {
                    // まだシェイクしていない
                    if (!isShaking) {
                        isShaking = true;

                        lastDirection = direction;
                    }

                    // 反対方向へ振った
                    else if (
                        direction !== lastDirection &&
                        now - lastShakeTime >= SHAKE_COOLDOWN
                    ) {
                        // =====================
                        // シェイク1回成立
                        // =====================

                        shakeCount++;

                        lastShakeTime = now;

                        lastDirection = direction;


                        console.log(
                            "SHAKE!",
                            shakeCount
                        );


                        document.getElementById("power")
                            .textContent =
                            "SHAKE! × " + shakeCount;
                    }
                }


                // 動きが小さくなったらシェイク終了
                if (movement < 1.0) {
                    isShaking = false;
                }


                // 前回値を保存
                previousX = x;
                previousY = y;
                previousZ = z;
            }
        }

    </script>

</body>

</html>
